<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>מגזין ישראגייז | כתבות וסיפורים מהקהילה הגאה בישראל</title>
<meta name="description" content="מגזין ישראגייז: כתבות, סיפורים אישיים, חדשות ומדריכים לקהילה הגאה בישראל.">
<link rel="canonical" href="https://isragays.github.io/magazine.html">
<link rel="icon" type="image/jpeg" href="/אייקון.jpg">

<style>
:root {
  --bg: #080e1c;
  --surface: #111c31;
  --text: #f6f8ff;
  --muted: #a8b6cc;
  --gold: #f3cb75;
  --line: rgba(255,255,255,.1);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.8;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1120px, calc(100% - 36px));
  margin: auto;
}

/* HEADER */

header {
  background: #0b1428;
  border-bottom: 1px solid var(--line);
  padding: 20px 0;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  color: var(--gold);
  font-size: 24px;
  font-weight: 900;
}

.home-link {
  color: var(--muted);
  font-size: 14px;
}

/* MAGAZINE HERO */

.hero {
  text-align: center;
  padding: 75px 0 60px;
  background: radial-gradient(
    ellipse at top,
    #1b355b,
    #0b1427 65%,
    var(--bg)
  );
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
}

.hero h1 {
  font-size: clamp(38px, 7vw, 68px);
  line-height: 1.2;
  margin: 15px 0;
}

.hero p {
  color: var(--muted);
  max-width: 620px;
  margin: auto;
  font-size: 17px;
}

/* ARTICLES GRID */

.section-title {
  font-size: 27px;
  margin: 40px 0 25px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding-bottom: 85px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  transition: .25s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: var(--gold);
}

.card-image {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  display: block;
}

.placeholder {
  background: #192a45;
  display: grid;
  place-items: center;
  font-size: 48px;
}

.card-content {
  padding: 23px;
}

.meta {
  color: var(--gold);
  font-size: 13px;
  font-weight: bold;
}

.card h2 {
  font-size: 23px;
  line-height: 1.4;
  margin: 12px 0;
}

.card p {
  color: var(--muted);
  font-size: 15px;
  margin: 0;
}

.read-more {
  color: var(--gold);
  font-weight: bold;
  display: inline-block;
  margin-top: 20px;
}

/* FULL ARTICLE */

.article {
  max-width: 790px;
  margin: 55px auto 100px;
}

.article h1 {
  font-size: clamp(34px, 6vw, 54px);
  line-height: 1.25;
  margin: 16px 0;
}

.article-subtitle {
  color: var(--muted);
  font-size: 20px;
  line-height: 1.8;
  margin-bottom: 30px;
}

.article-cover {
  width: 100%;
  max-height: 470px;
  object-fit: cover;
  border-radius: 20px;
  margin: 15px 0 35px;
}

.article-body {
  font-size: 18px;
  line-height: 1.95;
  overflow-wrap: anywhere;
}

.article-body p {
  margin: 0 0 22px;
}

.article-body h2 {
  color: var(--gold);
  font-size: 27px;
  margin: 38px 0 16px;
  line-height: 1.5;
}

.article-body h3 {
  color: var(--gold);
  font-size: 22px;
  margin: 30px 0 14px;
}

.article-body img {
  max-width: 100%;
  height: auto;
}

.article-body a {
  color: var(--gold);
  text-decoration: underline;
}

.article-back {
  color: var(--gold);
  display: inline-block;
  margin-top: 45px;
  font-weight: bold;
}

/* MESSAGES */

.message {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  padding: 65px 20px;
}

/* FOOTER */

footer {
  border-top: 1px solid var(--line);
  text-align: center;
  padding: 30px 15px;
  color: var(--muted);
  font-size: 14px;
}

/* MOBILE */

@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .hero {
    padding: 55px 0 40px;
  }

  .logo {
    font-size: 20px;
  }

  .home-link {
    font-size: 12px;
  }

  .article {
    margin-top: 30px;
  }

  .article-body {
    font-size: 17px;
  }

  .article-subtitle {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <a class="logo" href="/">ישראגייז 🇮🇱🏳️‍🌈</a>
    <a class="home-link" href="/">חזרה לאתר הראשי ←</a>
  </div>
</header>

<main id="app">

  <section class="hero">
    <div class="container">
      <div class="eyebrow">ISRAGAYS MAGAZINE</div>
      <h1>מגזין ישראגייז.</h1>
      <p>סיפורים, אנשים, חדשות ונקודות מבט מהקהילה הגאה בישראל.</p>
    </div>
  </section>

  <section class="container">
    <h2 class="section-title">הכתבות האחרונות</h2>

    <div class="grid" id="articles-grid">
      <div class="message">טוען כתבות...</div>
    </div>
  </section>

</main>

<footer>
  © <span id="year"></span> ישראגייז | הבית של הגייז בישראל
</footer>

<script>
const OWNER = "isragays";
const REPO = "isragays.github.io";
const FOLDER = "מאמרים";

const app = document.getElementById("app");

document.getElementById("year").textContent =
  new Date().getFullYear();

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  return Number.isNaN(date.getTime())
    ? ""
    : date.toLocaleDateString("he-IL");
}

function categoryName(value) {
  const categories = {
    community: "חברה וקהילה",
    news: "חדשות",
    relationships: "היכרויות וזוגיות",
    guides: "מדריכים",
    events: "אירועים"
  };

  return categories[value] || value || "";
}

function imageURL(value) {
  if (!value || typeof value !== "string") return "";

  if (/^https?:\/\//i.test(value)) return value;

  return "/" + value.replace(/^\/+/, "");
}

function articleLink(filename) {
  return "magazine.html?article=" + encodeURIComponent(filename);
}

/* CLEAN ARTICLE CONTENT */

function cleanContent(value) {
  return String(value || "")
    .replace(/&amp;nbsp;/gi, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/&#160;/gi, " ")
    .replace(/&#xA0;/gi, " ")
    .replace(/\u00a0/g, " ")
    .replace(/<p>\s*<\/p>/gi, "")
    .replace(/<p>\s*(?:&nbsp;|\s)*<\/p>/gi, "");
}

/* ARTICLE CARD */

function articleCard(article) {
  const image = imageURL(article.image);

  const cover = image
    ? `<img class="card-image"
         src="${escapeHTML(image)}"
         alt="${escapeHTML(article.title)}"
         loading="lazy">`
    : `<div class="card-image placeholder">📰</div>`;

  const category = escapeHTML(categoryName(article.category));
  const date = escapeHTML(formatDate(article.date));

  return `
    <a class="card" href="${articleLink(article.filename)}">
      ${cover}

      <div class="card-content">
        <div class="meta">
          ${category} ${date ? " • " + date : ""}
        </div>

        <h2>${escapeHTML(article.title)}</h2>

        <p>${escapeHTML(article.description || "")}</p>

        <span class="read-more">לקריאת הכתבה ←</span>
      </div>
    </a>
  `;
}

/* LOAD MAGAZINE */

async function loadMagazine() {
  const grid = document.getElementById("articles-grid");

  try {
    const api =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(FOLDER)}`;

    const response = await fetch(api);

    if (!response.ok) throw new Error("Cannot load articles");

    const files = await response.json();

    const jsonFiles = files.filter(file =>
      file.type === "file" &&
      file.name.toLowerCase().endsWith(".json")
    );

    const articles = await Promise.all(
      jsonFiles.map(async file => {
        try {
          const response = await fetch(
            `/${encodeURIComponent(FOLDER)}/${encodeURIComponent(file.name)}`
          );

          if (!response.ok) return null;

          const data = await response.json();

          return { ...data, filename: file.name };
        } catch {
          return null;
        }
      })
    );

    const validArticles = articles
      .filter(article => article && article.title)
      .sort((a, b) =>
        String(b.date || "").localeCompare(String(a.date || ""))
      );

    grid.innerHTML = validArticles.length
      ? validArticles.map(articleCard).join("")
      : `<div class="message">בקרוב יעלו כתבות חדשות.</div>`;

  } catch {
    grid.innerHTML =
      `<div class="message">לא הצלחנו לטעון כתבות כרגע.</div>`;
  }
}

/* RENDER ARTICLE BODY */

function renderBody(body) {
  let value = cleanContent(body);

  if (!value.trim()) return "";

  // Pages CMS rich text may contain HTML.
  if (/<[a-z][\s\S]*>/i.test(value)) {
    return value;
  }

  // Plain text fallback.
  return value
    .split(/\n\s*\n/)
    .filter(p => p.trim())
    .map(p => {
      const text = p.trim();

      return `<p>${escapeHTML(text).replace(/\n/g, "<br>")}</p>`;
    })
    .join("");
}

/* LOAD FULL ARTICLE */

async function loadArticle(filename) {
  if (
    !filename ||
    filename.includes("/") ||
    filename.includes("\\") ||
    !filename.endsWith(".json")
  ) {
    app.innerHTML =
      `<div class="message">הכתבה לא נמצאה.</div>`;
    return;
  }

  try {
    const response = await fetch(
      `/${encodeURIComponent(FOLDER)}/${encodeURIComponent(filename)}`
    );

    if (!response.ok) throw new Error("Not found");

    const article = await response.json();

    document.title =
      (article.title || "כתבה") + " | מגזין ישראגייז";

    const image = imageURL(article.image);

    app.innerHTML = `
      <div class="container">
        <article class="article">

          <div class="meta">
            ${escapeHTML(categoryName(article.category))}
            ${article.date ? " • " + escapeHTML(formatDate(article.date)) : ""}
          </div>

          <h1>${escapeHTML(article.title)}</h1>

          <div class="article-subtitle">
            ${escapeHTML(article.description || "")}
          </div>

          ${
            image
              ? `<img class="article-cover"
                  src="${escapeHTML(image)}"
                  alt="${escapeHTML(article.title)}">`
              : ""
          }

          <div class="article-body">
            ${renderBody(article.body)}
          </div>

          <a class="article-back" href="magazine.html">
            → חזרה לכל הכתבות
          </a>

        </article>
      </div>
    `;

  } catch {
    app.innerHTML =
      `<div class="message">לא הצלחנו לפתוח את הכתבה.</div>`;
  }
}

const requestedArticle =
  new URLSearchParams(window.location.search).get("article");

if (requestedArticle) {
  loadArticle(requestedArticle);
} else {
  loadMagazine();
}
</script>

</body>
</html>
