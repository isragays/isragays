<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>מגזין ישראגייז | הבית של הגייז בישראל</title>
  <meta name="description" content="מגזין ישראגייז – כתבות, סיפורים אישיים, חדשות ומדריכים מהקהילה הגאה בישראל.">
  <link rel="canonical" href="https://isragays.github.io/magazine.html">
  <link rel="icon" href="/logo.png" type="image/png">

  <style>
    :root {
      --bg: #080e1c;
      --header: #0b1428;
      --card: #111c31;
      --text: #f6f8ff;
      --muted: #a8b6cc;
      --gold: #f3cb75;
      --border: rgba(255,255,255,.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 36px));
      margin-inline: auto;
    }

    /* HEADER */

    .site-header {
      background: var(--header);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 105px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: auto;
      height: 70px;
      max-width: 210px;
      object-fit: contain;
    }

    .brand-fallback {
      display: none;
      color: var(--gold);
      font-size: 25px;
      font-weight: 900;
    }

    .back-home {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .back-home:hover {
      color: var(--gold);
    }

    /* MAGAZINE HERO */

    .hero {
      text-align: center;
      padding: 75px 0 65px;
      background: radial-gradient(
        ellipse at top,
        #1b355b,
        #0b1427 65%,
        var(--bg)
      );
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 68px);
      line-height: 1.2;
      margin: 15px 0;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
      font-size: 17px;
    }

    /* ARTICLE CARDS */

    .section-title {
      font-size: 27px;
      margin: 40px 0 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding-bottom: 85px;
    }

    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: transform .25s, border-color .25s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--gold);
    }

    .card-image {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #1b2c46;
    }

    .placeholder {
      display: grid;
      place-items: center;
      font-size: 45px;
    }

    .card-content {
      padding: 24px;
    }

    .meta {
      color: var(--gold);
      font-size: 13px;
      font-weight: bold;
    }

    .card h2 {
      font-size: 23px;
      line-height: 1.4;
      margin: 12px 0;
    }

    .card p {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
    }

    .read-more {
      display: inline-block;
      color: var(--gold);
      font-weight: bold;
      margin-top: 20px;
    }

    /* FULL ARTICLE */

    .article {
      max-width: 790px;
      margin: 55px auto 100px;
    }

    .article h1 {
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.25;
      margin: 15px 0;
    }

    .article-subtitle {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .article-cover {
      display: block;
      width: 100%;
      max-height: 470px;
      object-fit: cover;
      border-radius: 20px;
      margin: 15px 0 35px;
    }

    /* JUSTIFIED ARTICLE TEXT */

    .article-body {
      font-size: 18px;
      line-height: 1.85;
      overflow-wrap: break-word;
      text-align: justify;
      text-align-last: right;
    }

    .article-body p {
      margin: 0 0 22px;
      text-align: justify;
      text-align-last: right;
    }

    .article-body h2 {
      color: var(--gold);
      font-size: 27px;
      line-height: 1.4;
      margin: 38px 0 15px;
      text-align: right;
    }

    .article-body h3 {
      color: var(--gold);
      font-size: 22px;
      margin: 30px 0 14px;
      text-align: right;
    }

    .article-body img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .article-body a {
      color: var(--gold);
      text-decoration: underline;
    }

    .article-back {
      display: inline-block;
      margin-top: 45px;
      color: var(--gold);
      font-weight: bold;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 65px 20px;
      color: var(--muted);
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .nav {
        min-height: 85px;
      }

      .brand img {
        height: 52px;
        max-width: 155px;
      }

      .brand-fallback {
        font-size: 21px;
      }

      .back-home {
        font-size: 12px;
      }

      .hero {
        padding: 55px 0 45px;
      }

      .article {
        margin-top: 30px;
      }

      .article-body {
        font-size: 17px;
        line-height: 1.8;
      }

      .article-subtitle {
        font-size: 17px;
      }
    }
<!-- פונט Assistant לכל המגזין והכתבות -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&display=swap" rel="stylesheet">

<style>
  body, body *:not(i):not(svg):not(path) {
    font-family: 'Assistant', Arial, sans-serif !important;
  }
</style>
</head>

<body>

  <!-- SAME HEADER ON BOTH MAGAZINE AND ARTICLE PAGES -->

  <header class="site-header">
    <nav class="container nav">

      <a class="brand" href="/" aria-label="ישראגייז - האתר הראשי">
        <img
          src="/logo.png"
          alt="ישראגייז"
          id="site-logo"
          onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='inline-block';"
        >
        <span class="brand-fallback" id="logo-fallback">ישראגייז</span>
      </a>

      <a class="back-home" href="/">
        חזרה לאתר הראשי ←
      </a>

    </nav>
  </header>

  <main id="app">

    <section class="hero">
      <div class="container">
        <div class="eyebrow">ISRAGAYS MAGAZINE</div>
        <h1>מגזין ישראגייז.</h1>
        <p>סיפורים, אנשים, חדשות ונקודות מבט מהקהילה הגאה בישראל.</p>
      </div>
    </section>

    <section class="container">
      <h2 class="section-title">הכתבות האחרונות</h2>

      <div class="grid" id="articles-grid">
        <div class="message">טוען כתבות...</div>
      </div>
    </section>

  </main>

  <footer>
    © <span id="year"></span> ישראגייז | הבית של הגייז בישראל
  </footer>

  <script>
    const OWNER = "isragays";
    const REPO = "isragays.github.io";
    const FOLDER = "מאמרים";

    const app = document.getElementById("app");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleDateString("he-IL");
    }

    function categoryName(value) {
      const categories = {
        community: "חברה וקהילה",
        news: "חדשות",
        relationships: "היכרויות וזוגיות",
        guides: "מדריכים",
        events: "אירועים"
      };

      return categories[value] || value || "";
    }

    function imageURL(value) {
      if (!value || typeof value !== "string") return "";

      if (/^https?:\/\//i.test(value)) return value;

      return "/" + value.replace(/^\/+/, "");
    }

    function articleLink(filename) {
      return "magazine.html?article=" + encodeURIComponent(filename);
    }

    /* REMOVE UNWANTED SPACES AND HTML ENTITIES */

    function cleanText(value) {
      return String(value ?? "")
        .replace(/&amp;nbsp;/gi, " ")
        .replace(/&nbsp;/gi, " ")
        .replace(/&#160;/gi, " ")
        .replace(/&#x0*a0;/gi, " ")
        .replace(/\u00a0/g, " ")
        .replace(/\r\n?/g, "\n")
        .replace(/\\n/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n[ \t]+/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    /* FORMAT ARTICLE PARAGRAPHS */

    function renderBody(body) {
      const cleaned = cleanText(body);

      if (!cleaned) return "";

      const blocks = cleaned
        .split(/\n\s*\n/)
        .map(block => block.trim())
        .filter(Boolean);

      return blocks.map(block => {
        const text = block.replace(/\s*\n\s*/g, " ").trim();

        if (!text) return "";

        const safe = escapeHTML(text);

        const isHeading =
          text.length <= 75 &&
          !/[.!?։]$/.test(text) &&
          !text.includes("<") &&
          !text.includes(">");

        return isHeading
          ? `<h2>${safe}</h2>`
          : `<p>${safe}</p>`;
      }).join("");
    }

    /* ARTICLE PREVIEW CARD */

    function articleCard(article) {
      const image = imageURL(article.image);

      const cover = image
        ? `<img
             class="card-image"
             src="${escapeHTML(image)}"
             alt="${escapeHTML(article.title)}"
             loading="lazy"
           >`
        : `<div class="card-image placeholder">📰</div>`;

      return `
        <a class="card" href="${articleLink(article.filename)}">
          ${cover}

          <div class="card-content">
            <div class="meta">
              ${escapeHTML(categoryName(article.category))}
              ${article.date ? " • " + escapeHTML(formatDate(article.date)) : ""}
            </div>

            <h2>${escapeHTML(article.title)}</h2>

            <p>${escapeHTML(article.description || "")}</p>

            <span class="read-more">לקריאת הכתבה ←</span>
          </div>
        </a>
      `;
    }

    /* LOAD ALL ARTICLES */

    async function loadMagazine() {
      const grid = document.getElementById("articles-grid");

      try {
        const api =
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(FOLDER)}`;

        const response = await fetch(api);

        if (!response.ok) throw new Error("Cannot load articles");

        const files = await response.json();

        const jsonFiles = files.filter(file =>
          file.type === "file" &&
          file.name.toLowerCase().endsWith(".json")
        );

        const articles = await Promise.all(
          jsonFiles.map(async file => {
            try {
              const response = await fetch(
                `/${encodeURIComponent(FOLDER)}/${encodeURIComponent(file.name)}`
              );

              if (!response.ok) return null;

              const data = await response.json();

              return { ...data, filename: file.name };
            } catch {
              return null;
            }
          })
        );

        const validArticles = articles
          .filter(article => article && article.title)
          .sort((a, b) =>
            String(b.date || "").localeCompare(String(a.date || ""))
          );

        grid.innerHTML = validArticles.length
          ? validArticles.map(articleCard).join("")
          : `<div class="message">בקרוב יעלו כתבות חדשות.</div>`;

      } catch {
        grid.innerHTML =
          `<div class="message">לא הצלחנו לטעון כתבות כרגע.</div>`;
      }
    }

    /* LOAD SINGLE ARTICLE */

    async function loadArticle(filename) {
      if (
        !filename ||
        filename.includes("/") ||
        filename.includes("\\") ||
        !filename.endsWith(".json")
      ) {
        app.innerHTML =
          `<div class="message">הכתבה לא נמצאה.</div>`;
        return;
      }

      try {
        const response = await fetch(
          `/${encodeURIComponent(FOLDER)}/${encodeURIComponent(filename)}`
        );

        if (!response.ok) throw new Error("Not found");

        const article = await response.json();

        document.title =
          (article.title || "כתבה") + " | מגזין ישראגייז";

        const image = imageURL(article.image);

        app.innerHTML = `
          <div class="container">
            <article class="article">

              <div class="meta">
                ${escapeHTML(categoryName(article.category))}
                ${article.date ? " • " + escapeHTML(formatDate(article.date)) : ""}
              </div>

              <h1>${escapeHTML(article.title)}</h1>

              <div class="article-subtitle">
                ${escapeHTML(article.description || "")}
              </div>

              ${
                image
                  ? `<img
                       class="article-cover"
                       src="${escapeHTML(image)}"
                       alt="${escapeHTML(article.title)}"
                     >`
                  : ""
              }

              <div class="article-body">
                ${renderBody(article.body)}
              </div>

              <a class="article-back" href="magazine.html">
                → חזרה לכל הכתבות
              </a>

            </article>
          </div>
        `;

      } catch {
        app.innerHTML =
          `<div class="message">לא הצלחנו לפתוח את הכתבה.</div>`;
      }
    }

    /* START MAGAZINE */

    const requestedArticle =
      new URLSearchParams(window.location.search).get("article");

    if (requestedArticle) {
      loadArticle(requestedArticle);
    } else {
      loadMagazine();
    }
  </script>

</body>
</html>
