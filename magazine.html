<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>מגזין ישראגייז | הבית של הגייז בישראל</title>
<meta name="description" content="מגזין ישראגייז: כתבות, סיפורים אישיים, חדשות ומדריכים לקהילה הגאה בישראל.">
<link rel="canonical" href="https://isragays.github.io/magazine.html">
<link rel="icon" type="image/jpeg" href="/אייקון.jpg">

<meta property="og:type" content="website">
<meta property="og:title" content="מגזין ישראגייז">
<meta property="og:description" content="סיפורים, כתבות ונקודות מבט מהקהילה הגאה בישראל.">
<meta property="og:url" content="https://isragays.github.io/magazine.html">

<style>
:root {
  --bg: #080e1c;
  --surface: #111c31;
  --surface2: #172640;
  --text: #f6f8ff;
  --muted: #a8b6cc;
  --gold: #f3cb75;
  --line: rgba(255,255,255,.1);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.8;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1120px, calc(100% - 36px));
  margin-inline: auto;
}

/* HEADER */

header {
  background: rgba(10,18,35,.96);
  border-bottom: 1px solid var(--line);
  padding: 19px 0;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  color: var(--gold);
  font-size: 25px;
  font-weight: 900;
}

.home-link {
  font-size: 14px;
  color: var(--muted);
  transition: color .2s;
}

.home-link:hover {
  color: var(--gold);
}

/* HERO */

.hero {
  text-align: center;
  padding: 78px 0 62px;
  background:
    radial-gradient(
      ellipse at top,
      #1b355b 0%,
      #0b1427 55%,
      var(--bg) 100%
    );
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 3px;
}

.hero h1 {
  font-size: clamp(38px, 7vw, 70px);
  line-height: 1.15;
  margin: 15px 0;
  font-weight: 900;
}

.hero p {
  color: var(--muted);
  font-size: 17px;
  max-width: 650px;
  margin: 0 auto;
}

/* SECTION */

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin: 35px 0 25px;
}

.section-head h2 {
  font-size: 26px;
  margin: 0;
}

.section-head span {
  color: var(--muted);
  font-size: 14px;
}

/* ARTICLE GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding-bottom: 90px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .25s, border-color .25s;
}

.card:hover {
  transform: translateY(-6px);
  border-color: var(--gold);
}

.card-image {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  background: var(--surface2);
}

.placeholder {
  display: grid;
  place-items: center;
  font-size: 48px;
}

.card-content {
  padding: 24px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.meta {
  color: var(--gold);
  font-size: 13px;
  font-weight: bold;
}

.card h3 {
  font-size: 23px;
  line-height: 1.4;
  margin: 13px 0;
}

.card p {
  color: var(--muted);
  font-size: 15px;
  margin: 0 0 22px;
  line-height: 1.8;
}

.read-more {
  color: var(--gold);
  font-size: 15px;
  font-weight: bold;
  margin-top: auto;
}

/* ARTICLE PAGE */

.article {
  max-width: 790px;
  margin: 60px auto 100px;
}

.article h1 {
  font-size: clamp(34px, 6vw, 56px);
  line-height: 1.25;
  margin: 16px 0 20px;
}

.article-subtitle {
  color: var(--muted);
  font-size: 20px;
  line-height: 1.8;
  margin-bottom: 30px;
}

.article-cover {
  width: 100%;
  max-height: 460px;
  object-fit: cover;
  border-radius: 20px;
  margin: 15px 0 38px;
}

.article-body {
  font-size: 19px;
  line-height: 2;
  overflow-wrap: anywhere;
}

.article-body p {
  margin: 0 0 23px;
}

.article-body h2 {
  color: var(--gold);
  font-size: 28px;
  margin: 40px 0 17px;
  line-height: 1.5;
}

.article-body h3 {
  color: var(--gold);
  margin-top: 30px;
}

.article-body img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
}

.article-body a {
  color: var(--gold);
  text-decoration: underline;
}

.article-body blockquote {
  border-right: 3px solid var(--gold);
  margin: 30px 0;
  padding: 5px 20px;
  color: var(--muted);
}

.article-back {
  display: inline-block;
  color: var(--gold);
  font-weight: bold;
  margin-top: 45px;
}

/* MESSAGES */

.message {
  grid-column: 1 / -1;
  text-align: center;
  padding: 65px 20px;
  color: var(--muted);
}

/* FOOTER */

footer {
  border-top: 1px solid var(--line);
  padding: 32px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* MOBILE */

@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .hero {
    padding: 55px 0 45px;
  }

  .logo {
    font-size: 20px;
  }

  .home-link {
    font-size: 12px;
  }

  .article {
    margin: 35px auto 70px;
  }

  .article-body {
    font-size: 17px;
  }

  .article-subtitle {
    font-size: 17px;
  }

  .section-head h2 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <a class="logo" href="/">
      ישראגייז 🇮🇱🏳️‍🌈
    </a>

    <a class="home-link" href="/">
      חזרה לאתר הראשי ←
    </a>
  </div>
</header>

<main id="app">

  <section class="hero">
    <div class="container">
      <div class="eyebrow">ISRAGAYS MAGAZINE</div>

      <h1>מגזין ישראגייז.</h1>

      <p>
        סיפורים, אנשים, חדשות ונקודות מבט
        מהקהילה הגאה בישראל.
      </p>
    </div>
  </section>

  <section class="container">
    <div class="section-head">
      <h2>הכתבות האחרונות</h2>
      <span>תוכן חדש מהקהילה</span>
    </div>

    <div class="grid" id="articles-grid">
      <div class="message">טוען כתבות...</div>
    </div>
  </section>

</main>

<footer>
  © <span id="year"></span>
  ישראגייז | הבית של הגייז בישראל
</footer>

<script>
const OWNER = "isragays";
const REPO = "isragays.github.io";
const FOLDER = "מאמרים";

const app = document.getElementById("app");

document.getElementById("year").textContent =
  new Date().getFullYear();

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]
  );
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString("he-IL");
}

function categoryName(value) {
  const categories = {
    community: "חברה וקהילה",
    news: "חדשות",
    relationships: "היכרויות וזוגיות",
    guides: "מדריכים",
    events: "אירועים"
  };

  return categories[value] || value || "";
}

function imageURL(value) {
  if (!value || typeof value !== "string") {
    return "";
  }

  if (/^https?:\/\//i.test(value)) {
    return value;
  }

  return "/" + value.replace(/^\/+/, "");
}

function articleLink(filename) {
  return "magazine.html?article=" +
    encodeURIComponent(filename);
}

function articleCard(article) {
  const image = imageURL(article.image);

  const cover = image
    ? `<img
         class="card-image"
         src="${escapeHTML(image)}"
         alt="${escapeHTML(article.title)}"
         loading="lazy">`
    : `<div class="card-image placeholder">📰</div>`;

  const category = escapeHTML(
    categoryName(article.category)
  );

  const date = escapeHTML(
    formatDate(article.date)
  );

  return `
    <a class="card" href="${articleLink(article.filename)}">

      ${cover}

      <div class="card-content">

        <div class="meta">
          ${category}
          ${date ? " • " + date : ""}
        </div>

        <h3>${escapeHTML(article.title)}</h3>

        <p>
          ${escapeHTML(article.description || "")}
        </p>

        <span class="read-more">
          לקריאת הכתבה ←
        </span>

      </div>

    </a>
  `;
}

async function loadMagazine() {
  const grid = document.getElementById("articles-grid");

  try {
    const api =
      "https://api.github.com/repos/" +
      OWNER + "/" + REPO +
      "/contents/" + encodeURIComponent(FOLDER);

    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("Cannot load articles");
    }

    const files = await response.json();

    const jsonFiles = files.filter(file =>
      file.type === "file" &&
      file.name.toLowerCase().endsWith(".json")
    );

    const articles = await Promise.all(
      jsonFiles.map(async file => {
        try {
          const url =
            "/" + encodeURIComponent(FOLDER) +
            "/" + encodeURIComponent(file.name);

          const articleResponse = await fetch(url);

          if (!articleResponse.ok) {
            return null;
          }

          const data = await articleResponse.json();

          return {
            ...data,
            filename: file.name
          };
        } catch {
          return null;
        }
      })
    );

    const validArticles = articles
      .filter(article =>
        article && article.title
      )
      .sort((a, b) =>
        String(b.date || "").localeCompare(
          String(a.date || "")
        )
      );

    if (!validArticles.length) {
      grid.innerHTML = `
        <div class="message">
          בקרוב יעלו כתבות חדשות למגזין.
        </div>
      `;
      return;
    }

    grid.innerHTML = validArticles
      .map(articleCard)
      .join("");

  } catch (error) {
    grid.innerHTML = `
      <div class="message">
        לא הצלחנו לטעון את הכתבות כרגע.
        נסו לרענן את העמוד.
      </div>
    `;
  }
}

function renderBody(body) {
  const value = String(body || "");

  if (!value) return "";

  // Pages CMS can save rich text as HTML.
  if (/<[a-z][\s\S]*>/i.test(value)) {
    return value;
  }

  // Fallback for plain text.
  return value
    .split(/\n\s*\n/)
    .map(paragraph =>
      "<p>" +
      escapeHTML(paragraph).replace(/\n/g, "<br>") +
      "</p>"
    )
    .join("");
}

async function loadArticle(filename) {
  if (
    !filename ||
    filename.includes("/") ||
    filename.includes("\\") ||
    !filename.endsWith(".json")
  ) {
    app.innerHTML = `
      <div class="message">
        הכתבה המבוקשת לא נמצאה.
      </div>
    `;
    return;
  }

  try {
    const url =
      "/" + encodeURIComponent(FOLDER) +
      "/" + encodeURIComponent(filename);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Article not found");
    }

    const article = await response.json();

    document.title =
      (article.title || "כתבה") +
      " | מגזין ישראגייז";

    const image = imageURL(article.image);

    const category = escapeHTML(
      categoryName(article.category)
    );

    const date = escapeHTML(
      formatDate(article.date)
    );

    app.innerHTML = `
      <div class="container">

        <article class="article">

          <div class="meta">
            ${category}
            ${date ? " • " + date : ""}
          </div>

          <h1>
            ${escapeHTML(article.title)}
          </h1>

          <div class="article-subtitle">
            ${escapeHTML(article.description || "")}
          </div>

          ${
            image
              ? `<img
                   class="article-cover"
                   src="${escapeHTML(image)}"
                   alt="${escapeHTML(article.title)}">`
              : ""
          }

          <div class="article-body">
            ${renderBody(article.body)}
          </div>

          <a class="article-back" href="magazine.html">
            → חזרה לכל הכתבות
          </a>

        </article>

      </div>
    `;

  } catch (error) {
    app.innerHTML = `
      <div class="message">
        לא הצלחנו לפתוח את הכתבה.
      </div>
    `;
  }
}

const requestedArticle =
  new URLSearchParams(
    window.location.search
  ).get("article");

if (requestedArticle) {
  loadArticle(requestedArticle);
} else {
  loadMagazine();
}
</script>

</body>
</html>
